<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270">
  <defs>
    <marker id="a-ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fbf"/></marker>
    <marker id="a-ak" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
    <marker id="a-aks" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#222"/></marker>
  </defs>
  <line x1="10" y1="150" x2="500" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
  <path d="M 80 80 Q 94 150 80 220 Q 66 150 80 80 Z" fill="none" stroke="#222" stroke-width="1.6"/>
  <path d="M 280 80 Q 294 150 280 220 Q 266 150 280 80 Z" fill="none" stroke="#222" stroke-width="1.6"/>
  <circle cx="35" cy="150" r="3.5" fill="#222"/>
  <text x="29" y="172" font-family="Times New Roman, serif" font-size="15" fill="#222">S</text>
  <!-- rays -->
  <g stroke="#1f5fbf" stroke-width="1.8" fill="none">
    <polyline points="35,150 80,100 280,127.8 312,150"/>
    <polyline points="35,150 80,200 280,172.2 312,150"/>
  </g>
  <line x1="80" y1="100" x2="180.0" y2="113.9" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
  <g stroke="#888" stroke-width="1" stroke-dasharray="4,3">
    <line x1="280" y1="127.8" x2="440" y2="150"/>
    <line x1="280" y1="172.2" x2="440" y2="150"/>
  </g>
  <circle cx="440" cy="150" r="3.5" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <circle cx="312" cy="150" r="3.5" fill="#c0392b"/>
  <text x="430" y="138" font-family="Times New Roman, serif" font-size="15" fill="#c0392b">I<tspan baseline-shift="sub" font-size="10">1</tspan></text>
  <text x="308" y="136" font-family="Times New Roman, serif" font-size="15" fill="#c0392b">I<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <text x="52" y="74" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">レンズ(往路)</text>
  <text x="252" y="74" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">レンズ(復路)</text>
  <!-- dims -->
  <line x1="82" y1="245" x2="278" y2="245" stroke="#222" stroke-width="1" marker-start="url(#a-aks)" marker-end="url(#a-ak)"/>
  <text x="120.0" y="265" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">空気換算 2</text>
  <text x="190.0" y="265" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">D</text>
  <text x="204.0" y="265" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222"> = 5</text>
  <text x="230.0" y="265" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">f</text>
  <line x1="82" y1="225" x2="438" y2="225" stroke="#888" stroke-width="1" marker-start="url(#a-aks)" marker-end="url(#a-ak)"/>
  <text x="414" y="220" font-family="Times New Roman, serif" font-size="15" fill="#222">9<tspan font-style="italic">f</tspan></text>
  <text x="10" y="26" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">鏡で折り返した光路を一直線に展開した図（液体は空気換算）</text>
  <text x="330" y="50" font-family="Times New Roman, serif" font-size="15" fill="#c0392b">I<tspan baseline-shift="sub" font-size="10">1</tspan></text>
  <text x="344" y="50" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#c0392b">：復路レンズに対する虚物体</text>
