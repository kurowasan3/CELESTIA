<text x="300.0" y="300.0" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222" text-anchor="middle">空気の系では B は静止し，O が速さ <tspan font-family="Times New Roman, serif" font-style="italic">w</tspan> で風上へ動く</text>
<text x="300.0" y="320.0" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222" text-anchor="middle">振動数は「聞く瞬間の B の位置」から O への向きで決まる</text>
