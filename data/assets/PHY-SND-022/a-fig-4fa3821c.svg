<marker id="a-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="a-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<line x1="30.0" y1="90.0" x2="570.0" y2="90.0" stroke="#888" stroke-width="1" stroke-dasharray="6,4" fill="none"/>
<circle cx="300.0" cy="260.0" r="4" fill="#222"/>
<text x="310.0" y="278.0" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222" text-anchor="start">O</text>
<circle cx="300.0" cy="90.0" r="3" fill="#222"/>
<text x="296.0" y="80.0" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222" text-anchor="end">H</text>
<circle cx="385.7" cy="90.0" r="7" stroke="#c0392b" stroke-width="1.6" fill="none"/>
<text x="395.7" y="80.0" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">B（(2)の音を聞く瞬間）</text>
<line x1="385.7" y1="90.0" x2="300.0" y2="260.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,3" fill="none"/>
<circle cx="223.5" cy="90.0" r="7" stroke="#1f5fbf" stroke-width="1.6" fill="none"/>
