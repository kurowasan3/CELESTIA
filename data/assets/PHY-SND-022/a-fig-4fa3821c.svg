<line x1="223.5" y1="90.0" x2="300.0" y2="260.0" stroke="#1f5fbf" stroke-width="1.2" stroke-dasharray="5,3" fill="none"/>
<text x="261.8" y="110.0" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#1f5fbf" text-anchor="middle">Dw/V</text>
<line x1="300.0" y1="90.0" x2="300.0" y2="260.0" stroke="#888" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
