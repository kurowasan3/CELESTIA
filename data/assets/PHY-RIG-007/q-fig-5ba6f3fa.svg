<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <defs>
    <marker id="q-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>
  <!-- experiment 1 -->
