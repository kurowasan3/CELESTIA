  <circle cx="75" cy="86" r="4" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="200" cy="86" r="5" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon points="148,92 140,110 156,110" fill="none" stroke="#222" stroke-width="1.6"/>
  <line x1="120" y1="110" x2="176" y2="110" stroke="#222" stroke-width="1.6"/>
  <g stroke="#222" stroke-width="1"><line x1="124" y1="110" x2="118" y2="118"/><line x1="134" y1="110" x2="128" y2="118"/><line x1="144" y1="110" x2="138" y2="118"/><line x1="154" y1="110" x2="148" y2="118"/><line x1="164" y1="110" x2="158" y2="118"/><line x1="174" y1="110" x2="168" y2="118"/></g>
  <text x="16" y="91" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">A</text>
  <text x="296" y="91" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">B</text>
  <line x1="30" y1="62" x2="148" y2="62" stroke="#888" stroke-width="1" marker-start="url(#q-ag)" marker-end="url(#q-ag)"/>
  <line x1="148" y1="58" x2="148" y2="80" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="84" y="56" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">l</text>
  <line x1="30" y1="140" x2="290" y2="140" stroke="#888" stroke-width="1" marker-start="url(#q-ag)" marker-end="url(#q-ag)"/>
  <text x="155" y="158" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">L</text>
  <text x="30" y="200" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">管の中の小球1（質量 <tspan font-family="Times New Roman, serif" font-style="italic">m</tspan>），</text>
  <text x="30" y="220" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">小球2（質量 2<tspan font-family="Times New Roman, serif" font-style="italic">m</tspan>）の位置は見えない</text>
  <!-- experiment 2 -->
  <text x="360" y="28" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">実験2</text>
  <line x1="440" y1="56" x2="440" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  <g transform="rotate(-12 440 60)">
    <rect x="434" y="54" width="12" height="260" fill="none" stroke="#222" stroke-width="1.6"/>
    <circle cx="440" cy="110" r="4" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="440" cy="230" r="5" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
  <circle cx="440" cy="60" r="3.2" fill="#222"/>
  <text x="414" y="64" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">A</text>
  <text x="488" y="324" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">B</text>
  <text x="458" y="56" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">水平な軸</text>
  <path d="M 440 150 A 90 90 0 0 0 459 148" fill="none" stroke="#222" stroke-width="1"/>
  <text x="446" y="172" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">θ</text>
