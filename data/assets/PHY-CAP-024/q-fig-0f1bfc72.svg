<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360">
  <defs>
    <marker id="q-ak" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5 L0,9 z" fill="#222"/>
    </marker>
  </defs>
  <!-- ===== bridge (left) ===== -->
  <!-- top node (100,40) ; bottom node (100,300) -->
  <!-- AC source on left vertical -->
  <line x1="30" y1="40" x2="30" y2="150" stroke="#222" stroke-width="1.6"/>
  <circle cx="30" cy="170" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
  <path d="M 20,170 C 25,160 28,160 30,170 C 32,180 35,180 40,170" fill="none" stroke="#222" stroke-width="1.4"/>
  <line x1="30" y1="188" x2="30" y2="300" stroke="#222" stroke-width="1.6"/>
  <text x="44" y="146" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">E<tspan baseline-shift="sub" font-size="10" font-style="normal">0</tspan><tspan font-style="normal" font-family="Noto Sans CJK JP, sans-serif" font-size="12"> sin</tspan>ωt</text>
  <line x1="30" y1="40" x2="250" y2="40" stroke="#222" stroke-width="1.6"/>
  <line x1="30" y1="300" x2="340" y2="300" stroke="#222" stroke-width="1.6"/>
  <!-- left arm: R2 then Cv (x=110) -->
  <line x1="110" y1="40" x2="110" y2="70" stroke="#222" stroke-width="1.6"/>
  <rect x="100" y="70" width="20" height="50" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="72" y="100" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">R<tspan baseline-shift="sub" font-size="10" font-style="normal">2</tspan></text>
  <line x1="110" y1="120" x2="110" y2="215" stroke="#222" stroke-width="1.6"/>
  <line x1="94" y1="215" x2="126" y2="215" stroke="#222" stroke-width="1.8"/>
  <line x1="94" y1="225" x2="126" y2="225" stroke="#222" stroke-width="1.8"/>
  <line x1="88" y1="236" x2="130" y2="204" stroke="#222" stroke-width="1.2" marker-end="url(#q-ak)"/>
  <line x1="110" y1="225" x2="110" y2="300" stroke="#222" stroke-width="1.6"/>
  <text x="62" y="262" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">C<tspan baseline-shift="sub" font-size="10">v</tspan></text>
  <!-- right arm: R1 then to capacitor AB (x=250) -->
  <line x1="250" y1="40" x2="250" y2="70" stroke="#222" stroke-width="1.6"/>
  <rect x="240" y="70" width="20" height="50" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="268" y="100" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">R<tspan baseline-shift="sub" font-size="10" font-style="normal">1</tspan></text>
  <line x1="250" y1="120" x2="250" y2="160" stroke="#222" stroke-width="1.6"/>
  <!-- detector between (110,160) and (250,160) -->
  <line x1="110" y1="160" x2="160" y2="160" stroke="#222" stroke-width="1.6"/>
  <circle cx="180" cy="160" r="15" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="174" y="166" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">G</text>
  <line x1="200" y1="160" x2="250" y2="160" stroke="#222" stroke-width="1.6"/>
  <circle cx="110" cy="160" r="3" fill="#222"/><circle cx="250" cy="160" r="3" fill="#222"/>
  <text x="150" y="192" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">検流計</text>
  <!-- wire from (250,160) to plate B ; bottom to plate A -->
  <polyline points="250,160 250,180 395,180 395,195" fill="none" stroke="#222" stroke-width="1.6"/>
  <polyline points="340,300 340,280" fill="none" stroke="#222" stroke-width="1.6"/>
  <!-- ===== cylinder (right) : horizontal axis, plates vertical ===== -->
  <line x1="330" y1="200" x2="590" y2="200" stroke="#222" stroke-width="1.6"/>
  <line x1="330" y1="280" x2="590" y2="280" stroke="#222" stroke-width="1.6"/>
  <!-- plate A fixed at left end -->
  <rect x="330" y="200" width="10" height="80" fill="#999" stroke="#222" stroke-width="1.2"/>
  <text x="318" y="330" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">極板A（固定）</text>
  <!-- plate B movable -->
  <rect x="400" y="202" width="10" height="76" fill="#999" stroke="#222" stroke-width="1.2"/>
  <line x1="395" y1="195" x2="405" y2="202" stroke="#222" stroke-width="1.2"/>
  <text x="414" y="330" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">極板B（可動）</text>
  <line x1="426" y1="318" x2="406" y2="282" stroke="#888" stroke-width="1"/>
  <!-- x dimension -->
  <line x1="340" y1="250" x2="400" y2="250" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
  <text x="365" y="244" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">x</text>
  <text x="347" y="272" font-family="Noto Sans CJK JP, sans-serif" font-size="11" fill="#222">封入気体</text>
  <!-- right side: pipe to measured gas -->
  <line x1="590" y1="200" x2="590" y2="225" stroke="#222" stroke-width="1.6"/>
  <line x1="590" y1="255" x2="590" y2="280" stroke="#222" stroke-width="1.6"/>
  <line x1="590" y1="225" x2="615" y2="225" stroke="#222" stroke-width="1.6"/>
  <line x1="590" y1="255" x2="615" y2="255" stroke="#222" stroke-width="1.6"/>
  <text x="470" y="236" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">測定する気体</text>
  <text x="490" y="256" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">圧力 <tspan font-family="Times New Roman, serif" font-style="italic">p</tspan></text>
  <text x="440" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">断面積 <tspan font-family="Times New Roman, serif" font-style="italic">S</tspan></text>
</svg>
