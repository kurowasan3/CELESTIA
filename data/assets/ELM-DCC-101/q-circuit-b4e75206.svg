<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" font-family="'Times New Roman', serif">
<g data-phys="battery:10 V">
<line x1="40" y1="160" x2="40" y2="115" stroke="currentColor" stroke-width="1.6"/>
<line x1="40" y1="105" x2="40" y2="60" stroke="currentColor" stroke-width="1.6"/>
<line x1="54" y1="105" x2="26" y2="105" stroke="currentColor" stroke-width="1.6"/>
<line x1="47" y1="115" x2="33" y2="115" stroke="currentColor" stroke-width="3"/>
<text x="60" y="110" font-size="15" text-anchor="start" dominant-baseline="middle" class="f-label" fill="currentColor">10 V</text>
</g>
<polyline points="40,60 100,60" fill="none" stroke="currentColor" stroke-width="1.6"/>
<g data-phys="resistor:R = 20 Ω">
<line x1="100" y1="60" x2="127" y2="60" stroke="currentColor" stroke-width="1.6"/>
<line x1="173" y1="60" x2="200" y2="60" stroke="currentColor" stroke-width="1.6"/>
<polygon points="127,67 173,67 173,53 127,53" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="150" y="42" font-size="15" text-anchor="middle" dominant-baseline="middle" class="f-label" fill="currentColor">R = 20 Ω</text>
</g>
<polyline points="200,60 260,60 260,160 40,160" fill="none" stroke="currentColor" stroke-width="1.6"/>
<g class="f-cur" data-dir="180" data-len="26">
<line x1="80" y1="160" x2="63.1" y2="160" stroke="currentColor" stroke-width="2.2"/>
<polygon points="54,160 63.1,155.76 63.1,164.24" fill="currentColor"/>
<text x="67" y="174" font-size="15" text-anchor="middle" dominant-baseline="middle" class="f-label" fill="currentColor" font-style="italic">I</text>
</g>
</svg>
