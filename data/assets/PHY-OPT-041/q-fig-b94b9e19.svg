<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
<defs><marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="q-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<!-- incoming light -->
<line x1="30" y1="110" x2="120" y2="110" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<line x1="30" y1="250" x2="120" y2="250" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<text x="34" y="96" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">入射光</text>
<!-- slit plate at x=150: slits at y=140 (S1) and y=200 (S2) -->
<line x1="150" y1="50" x2="150" y2="136" stroke="#222" stroke-width="3"/>
<line x1="150" y1="144" x2="150" y2="196" stroke="#222" stroke-width="3"/>
<line x1="150" y1="204" x2="150" y2="290" stroke="#222" stroke-width="3"/>
<!-- polarizers -->
<rect x="134" y="128" width="9" height="24" fill="none" stroke="#222" stroke-width="1.2"/>
<rect x="134" y="188" width="9" height="24" fill="none" stroke="#222" stroke-width="1.2"/>
<g stroke="#222" stroke-width="0.8"><line x1="134" y1="134" x2="140" y2="128"/><line x1="134" y1="142" x2="143" y2="133"/><line x1="134" y1="150" x2="143" y2="141"/><line x1="134" y1="194" x2="140" y2="188"/><line x1="134" y1="202" x2="143" y2="193"/><line x1="134" y1="210" x2="143" y2="201"/></g>
<text x="160" y="136" font-family="Times New Roman, serif" font-size="15" fill="#222">S<tspan baseline-shift="sub" font-size="10">1</tspan></text>
<text x="160" y="214" font-family="Times New Roman, serif" font-size="15" fill="#222">S<tspan baseline-shift="sub" font-size="10">2</tspan></text>
<text x="40" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">S₁：透過軸 <tspan font-family="Times New Roman, serif" font-style="italic">x</tspan> 方向</text>
<text x="40" y="320" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">S₂：透過軸 <tspan font-family="Times New Roman, serif" font-style="italic">e</tspan><tspan font-family="Times New Roman, serif" font-style="italic" baseline-shift="sub" font-size="10">θ</tspan> 方向</text>
<!-- s -->
<line x1="122" y1="140" x2="122" y2="200" stroke="#222" stroke-width="1" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
<text x="108" y="176" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">s</text>
<!-- axis -->
<line x1="150" y1="170" x2="420" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="8,3,2,3"/>
<!-- screen -->
<line x1="420" y1="50" x2="420" y2="290" stroke="#222" stroke-width="1.6"/>
<text x="426" y="186" font-family="Times New Roman, serif" font-size="15" fill="#222">O</text>
<line x1="440" y1="170" x2="440" y2="80" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<text x="446" y="90" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">u</text>
<!-- rays to P -->
<circle cx="420" cy="110" r="2.5" fill="#222"/>
<line x1="152" y1="140" x2="418" y2="110" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="152" y1="200" x2="418" y2="110" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
<!-- L -->
<line x1="150" y1="270" x2="420" y2="270" stroke="#222" stroke-width="1" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
<text x="280" y="288" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">L</text>
<text x="380" y="40" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">スクリーン</text>
<!-- z -->
<line x1="230" y1="310" x2="290" y2="310" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<text x="294" y="315" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">z</text>
<!-- inset: x-y plane viewed from +z  -->
<rect x="480" y="190" width="110" height="130" fill="none" stroke="#888" stroke-width="1"/>
<text x="486" y="208" font-family="Noto Sans CJK JP, sans-serif" font-size="11" fill="#222">偏光板の向き</text>
<line x1="510" y1="295" x2="580" y2="295" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<text x="574" y="312" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">x</text>
<line x1="510" y1="295" x2="510" y2="222" stroke="#222" stroke-width="1" marker-end="url(#q-ar)"/>
<text x="496" y="232" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">y</text>
<line x1="510" y1="295" x2="560" y2="250" stroke="#c0392b" stroke-width="1.8" marker-end="url(#q-ar)"/>
<text x="560" y="244" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#c0392b">e</text><text x="568" y="248" font-family="Times New Roman, serif" font-style="italic" font-size="10" fill="#c0392b">θ</text>
<path d="M540,295 A30,30 0 0 0 532,276" fill="none" stroke="#222" stroke-width="1"/>
<text x="544" y="288" font-family="Times New Roman, serif" font-style="italic" font-size="13" fill="#222">θ</text>
</svg>
