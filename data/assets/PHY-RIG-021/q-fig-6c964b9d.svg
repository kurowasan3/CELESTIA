<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400">
  <defs>
    <marker id="q-ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1f5fbf"/>
    </marker>
    <marker id="q-ak" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5 L0,9 z" fill="#222"/>
    </marker>
  </defs>
  <!-- floor -->
  <line x1="40" y1="350" x2="440" y2="350" stroke="#222" stroke-width="1.6"/>
  <g stroke="#222" stroke-width="1">
    <line x1="50" y1="350" x2="40" y2="362"/><line x1="70" y1="350" x2="60" y2="362"/><line x1="90" y1="350" x2="80" y2="362"/>
    <line x1="110" y1="350" x2="100" y2="362"/><line x1="130" y1="350" x2="120" y2="362"/><line x1="150" y1="350" x2="140" y2="362"/>
    <line x1="170" y1="350" x2="160" y2="362"/><line x1="190" y1="350" x2="180" y2="362"/><line x1="210" y1="350" x2="200" y2="362"/>
    <line x1="230" y1="350" x2="220" y2="362"/><line x1="250" y1="350" x2="240" y2="362"/><line x1="270" y1="350" x2="260" y2="362"/>
    <line x1="290" y1="350" x2="280" y2="362"/><line x1="310" y1="350" x2="300" y2="362"/><line x1="330" y1="350" x2="320" y2="362"/>
    <line x1="350" y1="350" x2="340" y2="362"/><line x1="370" y1="350" x2="360" y2="362"/><line x1="390" y1="350" x2="380" y2="362"/>
    <line x1="410" y1="350" x2="400" y2="362"/><line x1="430" y1="350" x2="420" y2="362"/><line x1="450" y1="350" x2="440" y2="362"/>
  </g>
  <!-- rod -->
  <line x1="260" y1="60" x2="260" y2="330" stroke="#222" stroke-width="3"/>
  <!-- pivot O at y=150 ; l = 90px -->
  <circle cx="260" cy="150" r="5" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text x="270" y="146" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">O</text>
  <!-- B at y=60 -->
  <circle cx="260" cy="60" r="9" fill="#bbb" stroke="#222" stroke-width="1.6"/>
  <text x="274" y="56" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">B</text>
  <text x="274" y="76" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">m</text>
  <!-- A at y=240 -->
  <circle cx="260" cy="240" r="13" fill="#bbb" stroke="#222" stroke-width="1.6"/>
  <text x="278" y="236" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">A</text>
  <text x="278" y="257" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">3<tspan font-family="Times New Roman, serif" font-style="italic">m</tspan></text>
  <!-- D at y=330 -->
  <text x="270" y="334" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">D</text>
  <!-- dimension lines -->
  <g stroke="#888" stroke-width="1" stroke-dasharray="4,3">
    <line x1="225" y1="60" x2="252" y2="60"/><line x1="225" y1="150" x2="254" y2="150"/>
    <line x1="225" y1="240" x2="246" y2="240"/><line x1="225" y1="330" x2="256" y2="330"/>
  </g>
  <g stroke="#222" stroke-width="1">
    <line x1="230" y1="62" x2="230" y2="148" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
    <line x1="230" y1="152" x2="230" y2="238" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
    <line x1="230" y1="242" x2="230" y2="328" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
  </g>
  <text x="212" y="110" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">ℓ</text>
  <text x="212" y="200" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">ℓ</text>
  <text x="212" y="290" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">ℓ</text>
  <!-- block C -->
  <rect x="100" y="322" width="28" height="28" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="106" y="320" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">C</text>
  <text x="76" y="320" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">2<tspan font-family="Times New Roman, serif" font-style="italic">m</tspan></text>
  <line x1="134" y1="338" x2="190" y2="338" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
  <text x="155" y="330" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#1f5fbf">u</text>
  <!-- g -->
  <line x1="400" y1="60" x2="400" y2="110" stroke="#222" stroke-width="1.6" marker-end="url(#q-ak)"/>
  <text x="410" y="90" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">g</text>
  <text x="330" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（鉛直な壁の面内）</text>
</svg>
