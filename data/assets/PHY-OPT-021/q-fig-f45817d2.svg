<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260">
<defs><marker id="q-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="q-ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker></defs>
<!-- axis: light comes from left -->
<line x1="20" y1="130" x2="600" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>
<!-- L1 convex at x=150 -->
<path d="M150,50 Q170,130 150,210 Q130,130 150,50 Z" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="140" y="40" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">L<tspan baseline-shift="sub" font-size="10" font-style="normal">1</tspan></text>
<!-- L2 concave at x=150+4a, a=30px -> 270 -->
<path d="M260,85 L280,85 Q268,130 280,175 L260,175 Q272,130 260,85 Z" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="262" y="76" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">L<tspan baseline-shift="sub" font-size="10" font-style="normal">2</tspan></text>
<!-- screen at 270+6a=450 -->
<line x1="450" y1="60" x2="450" y2="200" stroke="#222" stroke-width="1.6"/>
<text x="456" y="70" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">S</text>
<!-- R aperture radius -->
<line x1="120" y1="130" x2="120" y2="52" stroke="#222" stroke-width="1" marker-end="url(#q-ah)"/>
<text x="102" y="80" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">R</text>
<!-- incoming light -->
<line x1="30" y1="100" x2="85" y2="100" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ahb)"/>
<line x1="30" y1="160" x2="85" y2="160" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ahb)"/>
<text x="24" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">遠方の物体からの光</text>
<!-- dims -->
<line x1="150" y1="232" x2="270" y2="232" stroke="#222" stroke-width="1" marker-start="url(#q-ah)" marker-end="url(#q-ah)"/>
<text x="198" y="226" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222"><tspan font-style="normal">4</tspan>a</text>
<line x1="150" y1="212" x2="150" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="270" y1="176" x2="270" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
<text x="330" y="215" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">凸レンズ L<tspan baseline-shift="sub" font-size="9">1</tspan>：焦点距離 6<tspan font-family="Times New Roman, serif" font-style="italic">a</tspan></text>
<text x="330" y="237" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">凹レンズ L<tspan baseline-shift="sub" font-size="9">2</tspan>：焦点距離 3<tspan font-family="Times New Roman, serif" font-style="italic">a</tspan></text>
</svg>
