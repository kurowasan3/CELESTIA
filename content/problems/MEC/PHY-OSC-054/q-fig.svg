<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360">
<defs>
<marker id="q-ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fbf"/></marker>
<marker id="q-ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker>
<marker id="q-ak0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#222"/></marker>
</defs>
<!-- disk (top view) -->
<ellipse cx="150" cy="190" rx="0" ry="0"/>
<circle cx="150" cy="190" r="395" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="150" cy="190" r="4" fill="#222"/>
<text x="118" y="222" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">回転軸</text>
<path d="M 196 120 A 84 84 0 0 0 84 138" fill="none" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<text x="128" y="96" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">ω</text>
<text x="20" y="340" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">円盤（上から見た図．円盤の縁は図の右端）</text>
<!-- cylinder from axis to L -->
<rect x="150" y="172" width="380" height="36" fill="none" stroke="#222" stroke-width="1.6"/>
<!-- stopper -->
<rect x="260" y="172" width="6" height="7" fill="#222"/>
<rect x="260" y="201" width="6" height="7" fill="#222"/>
<text x="270" y="166" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">ストッパー</text>
<!-- piston -->
<rect x="330" y="173" width="8" height="34" fill="#888" stroke="#222" stroke-width="1.6"/>
<text x="352" y="196" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">A（<tspan font-family="Times New Roman, serif" font-style="italic">n</tspan> mol, <tspan font-family="Times New Roman, serif" font-style="italic">T</tspan>）</text>
<text x="185" y="196" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">真空</text>
<text x="318" y="230" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">ピストン <tspan font-family="Times New Roman, serif" font-style="italic">m</tspan></text>
<!-- dimension x -->
<line x1="150" y1="250" x2="334" y2="250" stroke="#222" stroke-width="1" marker-start="url(#q-ak0)" marker-end="url(#q-ak)"/>
<line x1="334" y1="208" x2="334" y2="256" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="236" y="268" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">x</text>
<line x1="150" y1="290" x2="530" y2="290" stroke="#222" stroke-width="1" marker-start="url(#q-ak0)" marker-end="url(#q-ak)"/>
<line x1="530" y1="208" x2="530" y2="296" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="336" y="308" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">L</text>
<line x1="150" y1="148" x2="263" y2="148" stroke="#222" stroke-width="1" marker-start="url(#q-ak0)" marker-end="url(#q-ak)"/>
<line x1="263" y1="150" x2="263" y2="172" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<text x="196" y="142" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">x<tspan baseline-shift="sub" font-size="10" font-style="normal">0</tspan></text>
<text x="420" y="160" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">断面積 <tspan font-family="Times New Roman, serif" font-style="italic">S</tspan></text>
</svg>
