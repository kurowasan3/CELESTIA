<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330">
<defs>
<marker id="a-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="a-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<text x="20" y="24" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">上から見た図（<tspan font-family="Times New Roman, serif" font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="10">0</tspan> = √3<tspan font-family="Times New Roman, serif" font-style="italic">L</tspan>/2，<tspan font-family="Times New Roman, serif" font-style="italic">ωτ</tspan> = 1 の場合）</text>
<!-- tube at exit -->
<line x1="120" y1="290" x2="270" y2="290" stroke="#222" stroke-width="5" stroke-opacity="0.35"/>
<line x1="120" y1="290" x2="270" y2="290" stroke="#222" stroke-width="1.6"/>
<!-- tube at landing -->
<line x1="120" y1="290" x2="260.5" y2="71.2" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
<text x="230.5" y="63.2" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">着地時の管の向き</text>
<!-- O'F line -->
<line x1="120" y1="290" x2="345.0" y2="140" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
<!-- trajectory A->F -->
<line x1="270" y1="290" x2="345.0" y2="140" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-ar)"/>
<circle cx="345.0" cy="140" r="4" fill="#222"/>
<text x="353.0" y="136" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">F</text>
<!-- velocity components at A -->
<line x1="270" y1="290" x2="330" y2="290" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ah)"/>
<text x="332" y="308" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">u</text>
<line x1="270" y1="290" x2="270" y2="170" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ah)"/>
<text x="230" y="190" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">ωL</text>
<circle cx="120" cy="290" r="3.5" fill="#222"/>
<text x="96" y="308" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">O′</text>
<text x="264" y="312" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">A</text>
<!-- angle arcs -->
<path d="M 175.0 290.0 A 55 55 0 0 0 165.8 259.5" fill="none" stroke="#222" stroke-width="1"/>
<text x="180" y="282" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">φ</text>
<path d="M 194.9 240.1 A 90 90 0 0 0 168.6 214.3" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<text x="192" y="220" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#c0392b">ψ</text>
<path d="M 150.0 290.0 A 30 30 0 0 0 136.2 264.8" fill="none" stroke="#888" stroke-width="1"/>
<text x="124" y="254" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#222">ωτ</text>
<text x="30" y="60" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">tan <tspan font-family="Times New Roman, serif" font-style="italic">φ</tspan> = <tspan font-family="Times New Roman, serif" font-style="italic">ωLτ</tspan> / (<tspan font-family="Times New Roman, serif" font-style="italic">L</tspan> + <tspan font-family="Times New Roman, serif" font-style="italic">uτ</tspan>)</text>
<text x="30" y="82" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222"><tspan font-family="Times New Roman, serif" font-style="italic">ψ</tspan> = <tspan font-family="Times New Roman, serif" font-style="italic">ωτ</tspan> − <tspan font-family="Times New Roman, serif" font-style="italic">φ</tspan> &gt; 0</text>
<text x="150" y="312" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">A を出る瞬間の管</text>
</svg>
