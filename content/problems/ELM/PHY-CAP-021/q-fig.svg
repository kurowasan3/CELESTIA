<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300">
<defs>
<marker id="q-ak" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#222"/></marker>
<pattern id="q-dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" fill="#888"/></pattern>
</defs>
<!-- plates -->
<rect x="200" y="80" width="260" height="6" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="200" y="200" width="260" height="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="500" y="88" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">P<tspan baseline-shift="sub" font-size="10">2</tspan></text>
<text x="500" y="208" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">P<tspan baseline-shift="sub" font-size="10">1</tspan></text>
<text x="518" y="88" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">：<tspan font-family="Times New Roman, serif" font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="10">2</tspan></text>
<text x="518" y="208" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">：<tspan font-family="Times New Roman, serif" font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="10">1</tspan></text>
<!-- dielectric slab: from x=60 to x=300 (inserted b=100 from 200) -->
<rect x="60" y="160" width="240" height="40" fill="url(#q-dots)" stroke="#222" stroke-width="1.6"/>
<text x="30" y="150" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">誘電体板（比誘電率 <tspan font-family="Times New Roman, serif" font-style="italic">ε</tspan><tspan baseline-shift="sub" font-size="10" font-family="Times New Roman, serif" font-style="italic">r</tspan>，質量 <tspan font-family="Times New Roman, serif" font-style="italic">m</tspan>）</text>
<!-- t -->
<line x1="45" y1="162" x2="45" y2="198" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
<text x="30" y="186" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">t</text>
<!-- d -->
<line x1="480" y1="88" x2="480" y2="198" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
<text x="486" y="150" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d</text>
<!-- b -->
<line x1="200" y1="230" x2="200" y2="212" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="300" y1="230" x2="300" y2="204" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="202" y1="225" x2="298" y2="225" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
<text x="245" y="243" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">b</text>
<!-- L -->
<line x1="460" y1="275" x2="460" y2="212" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="200" y1="275" x2="200" y2="232" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="202" y1="268" x2="458" y2="268" stroke="#222" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
<text x="325" y="288" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">L</text>
<!-- x axis arrow -->
<line x1="330" y1="40" x2="400" y2="40" stroke="#222" stroke-width="1.2" marker-end="url(#q-ak)"/>
<text x="406" y="45" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">x</text>
<text x="200" y="45" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">（奥行き <tspan font-family="Times New Roman, serif" font-style="italic">M</tspan>）</text>
</svg>
