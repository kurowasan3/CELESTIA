<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420">
  <defs>
    <marker id="q-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <!-- ground -->
  <line x1="40" y1="380" x2="520" y2="380" stroke="#222" stroke-width="1.6"/>
  <g stroke="#222" stroke-width="1">
    <line x1="50" y1="380" x2="40" y2="392"/><line x1="70" y1="380" x2="60" y2="392"/><line x1="90" y1="380" x2="80" y2="392"/><line x1="110" y1="380" x2="100" y2="392"/><line x1="130" y1="380" x2="120" y2="392"/><line x1="150" y1="380" x2="140" y2="392"/><line x1="170" y1="380" x2="160" y2="392"/><line x1="190" y1="380" x2="180" y2="392"/><line x1="210" y1="380" x2="200" y2="392"/><line x1="230" y1="380" x2="220" y2="392"/><line x1="250" y1="380" x2="240" y2="392"/><line x1="270" y1="380" x2="260" y2="392"/><line x1="290" y1="380" x2="280" y2="392"/><line x1="310" y1="380" x2="300" y2="392"/><line x1="330" y1="380" x2="320" y2="392"/><line x1="350" y1="380" x2="340" y2="392"/><line x1="370" y1="380" x2="360" y2="392"/><line x1="390" y1="380" x2="380" y2="392"/><line x1="410" y1="380" x2="400" y2="392"/><line x1="430" y1="380" x2="420" y2="392"/><line x1="450" y1="380" x2="440" y2="392"/><line x1="470" y1="380" x2="460" y2="392"/><line x1="490" y1="380" x2="480" y2="392"/><line x1="510" y1="380" x2="500" y2="392"/>
  </g>
  <!-- bags -->
  <circle cx="200" cy="95" r="62" fill="none" stroke="#222" stroke-width="1.6"/>
  <circle cx="200" cy="225" r="62" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="184" y="153" width="32" height="14" fill="#222"/>
  <text x="200" y="88" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">気体A</text>
  <text x="200" y="110" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">単原子分子</text>
  <text x="200" y="132" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">n<tspan font-style="normal" font-family="Noto Sans CJK JP, sans-serif" font-size="13"> mol</tspan></text>
  <text x="200" y="218" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">気体B</text>
  <text x="200" y="240" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">二原子分子</text>
  <text x="200" y="262" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">n<tspan font-style="normal" font-family="Noto Sans CJK JP, sans-serif" font-size="13"> mol</tspan></text>
  <!-- leader to plate -->
  <line x1="222" y1="160" x2="300" y2="160" stroke="#222" stroke-width="1"/>
  <text x="306" y="156" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">仕切り（熱を通す／</text>
  <text x="306" y="176" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">通さないを切り替え）</text>
  <!-- gondola -->
  <line x1="200" y1="287" x2="200" y2="300" stroke="#222" stroke-width="1.6"/>
  <rect x="180" y="300" width="40" height="22" fill="none" stroke="#222" stroke-width="1.6"/>
  <!-- rope -->
  <line x1="200" y1="322" x2="200" y2="380" stroke="#222" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="208" y="356" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">ロープ（(3)で使用）</text>
  <!-- atmosphere label -->
  <text x="330" y="60" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">大気：モル質量</text>
  <text x="438" y="60" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">M</text>
  <text x="330" y="84" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">温度</text>
  <text x="366" y="84" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">T<tspan baseline-shift="sub" font-size="10">0</tspan></text>
  <text x="384" y="84" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">（高さによらず一定）</text>
  <text x="330" y="108" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">地上の圧力</text>
  <text x="408" y="108" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">p<tspan baseline-shift="sub" font-size="10">0</tspan></text>
  <!-- gravity -->
  <line x1="480" y1="220" x2="480" y2="280" stroke="#222" stroke-width="1.6" marker-end="url(#q-ar)"/>
  <text x="490" y="255" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">g</text>
  <text x="300" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">気球全体の質量</text>
  <text x="402" y="300" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">m</text>
  <text x="60" y="372" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">地面</text>
</svg>
