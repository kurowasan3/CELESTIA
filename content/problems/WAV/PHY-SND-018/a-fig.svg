<circle cx="467.6" cy="89.4" r="5" fill="#fff" stroke="#222" stroke-width="1.6"/><text x="475.6" y="83.4" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">P</text>
<line x1="467.6" y1="89.4" x2="427.9" y2="68.2" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a-ab)"/>
<text x="360" y="272" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">(b) SP が円に接するとき <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">h</tspan> が最大（<tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">h</tspan> = <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">r</tspan>）</text>
<text x="360" y="292" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222"><tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">v</tspan><tspan baseline-shift="sub" font-size="10">SP</tspan> の最大値 = <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">ωr</tspan></text>
<text x="20" y="24" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">速度の SP 方向成分 = <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">ω</tspan> ×（O から直線 SP までの距離 <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">h</tspan>）</text>
