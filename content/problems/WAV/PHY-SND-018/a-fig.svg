<text x="80" y="302" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">(a) OS ⊥ SP のとき <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">h</tspan> が最大（<tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">h</tspan> = <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">d</tspan>）</text>
<text x="80" y="322" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222"><tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">v</tspan><tspan baseline-shift="sub" font-size="10">SP</tspan> の最大値 = <tspan font-family="Times New Roman, serif" font-style="italic" font-size="16">ωd</tspan></text>
<circle cx="430" cy="160" r="80" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="430" cy="160" r="3" fill="#222"/><text x="410" y="166" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">O</text>
