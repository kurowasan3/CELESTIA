<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
  <defs>
    <marker id="q-ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fbf"/></marker>
    <marker id="q-ak" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
    <marker id="q-aks" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#222"/></marker>
  </defs>
  <!-- source -->
  <rect x="20" y="108" width="50" height="24" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="26" y="100" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">光源</text>
  <!-- half mirror -->
  <line x1="108" y1="134" x2="132" y2="106" stroke="#222" stroke-width="2.4"/>
  <text x="92" y="98" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">半透鏡</text>
  <!-- detector -->
  <rect x="106" y="190" width="28" height="22" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="140" y="207" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">検出器</text>
  <!-- wheel edge -->
  <line x1="200" y1="50" x2="200" y2="190" stroke="#222" stroke-width="1.6"/>
  <g>
    <rect x="196" y="58" width="8" height="8" fill="#222"/>
    <rect x="196" y="74" width="8" height="8" fill="#222"/>
    <rect x="196" y="90" width="8" height="8" fill="#222"/>
    <rect x="196" y="106" width="8" height="8" fill="#222"/>
    <rect x="196" y="122" width="8" height="8" fill="#222"/>
    <rect x="196" y="138" width="8" height="8" fill="#222"/>
    <rect x="196" y="154" width="8" height="8" fill="#222"/>
    <rect x="196" y="170" width="8" height="8" fill="#222"/>
  </g>
  <text x="184" y="44" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">歯車 G</text>
  <!-- beam -->
  <line x1="70" y1="120" x2="560" y2="120" stroke="#1f5fbf" stroke-width="1.4"/>
  <line x1="120" y1="120" x2="120" y2="188" stroke="#1f5fbf" stroke-width="1.4" marker-end="url(#q-ab)"/>
  <line x1="250" y1="114" x2="300" y2="114" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
  <line x1="320" y1="126" x2="270" y2="126" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
  <!-- tube -->
  <rect x="380" y="104" width="120" height="32" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="400" y="96" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">管（長さ </text>
  <text x="458" y="96" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">L</text>
  <text x="468" y="96" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">）</text>
  <!-- mirror B -->
  <line x1="562" y1="90" x2="562" y2="150" stroke="#222" stroke-width="3"/>
  <g stroke="#222" stroke-width="1">
    <line x1="564" y1="94" x2="572" y2="86"/><line x1="564" y1="106" x2="572" y2="98"/><line x1="564" y1="118" x2="572" y2="110"/><line x1="564" y1="130" x2="572" y2="122"/><line x1="564" y1="142" x2="572" y2="134"/>
  </g>
  <text x="572" y="172" font-family="Times New Roman, serif" font-size="16" fill="#222">B</text>
  <!-- distance l -->
  <g stroke="#888" stroke-width="1" stroke-dasharray="3,3"><line x1="200" y1="190" x2="200" y2="232"/><line x1="562" y1="150" x2="562" y2="232"/></g>
  <line x1="202" y1="226" x2="560" y2="226" stroke="#222" stroke-width="1" marker-start="url(#q-aks)" marker-end="url(#q-ak)"/>
  <text x="378" y="246" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">l</text>
