  <text x="250" y="320" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#1f5fbf">エネルギーの位置 Q の軌跡（直径 PM）</text>
  <text x="250" y="342" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#888">位相の位置（直径 PS）</text>
