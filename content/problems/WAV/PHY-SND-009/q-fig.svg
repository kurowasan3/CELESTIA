<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
  <defs>
    <marker id="q-ax" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
    <marker id="q-ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fbf"/></marker>
    <marker id="q-dim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222" stroke-width="1"/></marker>
  </defs>
  <!-- cylinder -->
  <line x1="80" y1="60" x2="560" y2="60" stroke="#222" stroke-width="1.6"/>
  <line x1="80" y1="160" x2="560" y2="160" stroke="#222" stroke-width="1.6"/>
  <!-- speaker plate -->
  <rect x="74" y="60" width="8" height="100" fill="#888" stroke="#222" stroke-width="1.2"/>
  <rect x="50" y="95" width="24" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
  <path d="M50,110 C30,110 40,140 20,140" fill="none" stroke="#222" stroke-width="1"/>
  <text x="20" y="50" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">振動板（振動数 <tspan font-family="Times New Roman, serif" font-style="italic">f</tspan>）</text>
  <!-- lid -->
  <rect x="420" y="61" width="16" height="98" fill="none" stroke="#222" stroke-width="1.6"/>
  <g stroke="#222" stroke-width="1">
    <line x1="420" y1="75" x2="436" y2="65"/><line x1="420" y1="95" x2="436" y2="85"/><line x1="420" y1="115" x2="436" y2="105"/><line x1="420" y1="135" x2="436" y2="125"/><line x1="420" y1="155" x2="436" y2="145"/>
  </g>
  <text x="408" y="50" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">ふた</text>
  <line x1="450" y1="110" x2="500" y2="110" stroke="#1f5fbf" stroke-width="1.8" marker-start="url(#q-ar)" marker-end="url(#q-ar)"/>
  <text x="470" y="100" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">なめらかに動ける</text>
  <text x="510" y="140" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">外気</text>
  <text x="200" y="115" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">気体（物質量一定）</text>
  <!-- x axis -->
  <line x1="78" y1="200" x2="580" y2="200" stroke="#222" stroke-width="1" marker-end="url(#q-ax)"/>
  <text x="572" y="222" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">x</text>
  <line x1="78" y1="160" x2="78" y2="205" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="420" y1="160" x2="420" y2="205" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="74" y="222" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">0</text>
  <text x="414" y="224" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">ℓ</text>
</svg>
