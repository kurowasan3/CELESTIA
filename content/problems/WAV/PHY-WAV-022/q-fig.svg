<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380">
<defs>
<marker id="q-ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fbf"/></marker>
<marker id="q-ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker>
<marker id="q-ak0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#222"/></marker>
</defs>
<!-- ground -->
<line x1="20" y1="340" x2="500" y2="340" stroke="#222" stroke-width="1.6"/>
<g stroke="#222" stroke-width="1"><line x1="30" y1="340" x2="20" y2="352"/><line x1="60" y1="340" x2="50" y2="352"/><line x1="90" y1="340" x2="80" y2="352"/><line x1="120" y1="340" x2="110" y2="352"/><line x1="150" y1="340" x2="140" y2="352"/><line x1="180" y1="340" x2="170" y2="352"/><line x1="210" y1="340" x2="200" y2="352"/><line x1="240" y1="340" x2="230" y2="352"/><line x1="270" y1="340" x2="260" y2="352"/><line x1="300" y1="340" x2="290" y2="352"/><line x1="330" y1="340" x2="320" y2="352"/><line x1="360" y1="340" x2="350" y2="352"/><line x1="390" y1="340" x2="380" y2="352"/><line x1="420" y1="340" x2="410" y2="352"/><line x1="450" y1="340" x2="440" y2="352"/><line x1="480" y1="340" x2="470" y2="352"/></g>
