<text x="344" y="265" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">C</text>
<!-- dims -->
<line x1="400" y1="60" x2="400" y2="220" stroke="#222" stroke-width="1" marker-start="url(#q-ak0)" marker-end="url(#q-ak)"/>
<text x="408" y="145" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d<tspan baseline-shift="sub" font-size="10" font-style="normal">1</tspan><tspan font-style="normal" font-family="Noto Sans CJK JP, sans-serif" font-size="14"> = 4</tspan>λ</text>
<line x1="460" y1="60" x2="460" y2="260" stroke="#222" stroke-width="1" marker-start="url(#q-ak0)" marker-end="url(#q-ak)"/>
<text x="468" y="195" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d<tspan baseline-shift="sub" font-size="10" font-style="normal">2</tspan></text>
<line x1="360" y1="60" x2="470" y2="60" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="340" y1="220" x2="410" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="340" y1="260" x2="470" y2="260" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
<!-- incoming rays at elevation 20deg -->
<line x1="60" y1="-38" x2="322" y2="57" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<line x1="60" y1="122" x2="322" y2="217" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<line x1="60" y1="162" x2="322" y2="257" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
