<path d="M 262 220 A 60 60 0 0 1 266.1 198.2" fill="none" stroke="#222" stroke-width="1"/>
<text x="240" y="212" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">θ</text>
<!-- wavefronts perpendicular -->
<line x1="150" y1="60" x2="104" y2="186" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="200" y1="78" x2="154" y2="204" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
<text x="60" y="100" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">波面</text>
<text x="40" y="30" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">発信源の方向から</text>
<text x="300" y="368" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">地面</text>
