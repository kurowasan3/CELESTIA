<circle cx="330" cy="60" r="7" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="330" cy="220" r="7" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="330" cy="260" r="7" fill="none" stroke="#222" stroke-width="1.6"/>
