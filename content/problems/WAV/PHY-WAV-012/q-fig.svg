<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330">
<defs><marker id="q-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="q-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<!-- boat -->
<path d="M 90 205 L 230 205 L 262 230 L 230 255 L 90 255 Z" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="170" cy="230" r="5" fill="#222"/>
<text x="150" y="226" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222">S</text>
<!-- plate 1 : parallel, distance d to the side (up in figure) -->
<line x1="70" y1="90" x2="300" y2="90" stroke="#222" stroke-width="3"/>
<line x1="110" y1="92" x2="110" y2="205" stroke="#222" stroke-width="1"/>
<line x1="250" y1="92" x2="235" y2="207" stroke="#222" stroke-width="1"/>
<text x="304" y="86" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">反射板1</text>
<!-- plate 2 : perpendicular, distance d ahead -->
<line x1="310" y1="170" x2="310" y2="290" stroke="#222" stroke-width="3"/>
<line x1="262" y1="230" x2="310" y2="230" stroke="#222" stroke-width="1"/>
<text x="318" y="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">反射板2</text>
<!-- dimension d -->
<line x1="170" y1="223" x2="170" y2="96" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
<text x="176" y="160" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d</text>
<line x1="176" y1="280" x2="304" y2="280" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
<line x1="170" y1="236" x2="170" y2="288" stroke="#888" stroke-width="1"/>
<text x="232" y="298" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">d</text>
<!-- velocity -->
<line x1="360" y1="230" x2="440" y2="230" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ab)"/>
<text x="396" y="220" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">u</text>
<text x="452" y="236" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">x</text>
<text x="20" y="30" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">静止した水面（波の速さ</text>
<text x="176" y="30" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#222">V</text>
<text x="188" y="30" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">）を上から見た図</text>
</svg>
