<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330">
<defs>
<marker id="q-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="q-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="q-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.1" fill="#888"/></pattern>
</defs>
<text x="20" y="22" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">図1</text>
<!-- tube walls -->
<line x1="40" y1="50" x2="600" y2="50" stroke="#222" stroke-width="1.6"/>
<line x1="40" y1="120" x2="600" y2="120" stroke="#222" stroke-width="1.6"/>
<!-- compressed region -->
<rect x="130" y="51" width="200" height="68" fill="url(#q-dots)" stroke="none"/>
<!-- piston -->
<rect x="118" y="51" width="12" height="68" fill="#888" stroke="#222" stroke-width="1.6"/>
<rect x="40" y="80" width="78" height="10" fill="none" stroke="#222" stroke-width="1.6"/>
<!-- wave front -->
<line x1="330" y1="46" x2="330" y2="124" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,3"/>
<!-- arrows -->
<line x1="150" y1="35" x2="200" y2="35" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#q-ah)"/>
<text x="206" y="40" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#1f5fbf">w</text>
<line x1="335" y1="35" x2="395" y2="35" stroke="#c0392b" stroke-width="1.8" marker-end="url(#q-ah)"/>
<text x="400" y="40" font-family="Times New Roman, serif" font-style="italic" font-size="16" fill="#c0392b">c</text>
<text x="300" y="20" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">波面</text>
<text x="160" y="142" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">圧力 <tspan font-family="Times New Roman, serif" font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="10">0</tspan> + Δ<tspan font-family="Times New Roman, serif" font-style="italic">p</tspan>，速さ <tspan font-family="Times New Roman, serif" font-style="italic">w</tspan></text>
<text x="400" y="142" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">圧力 <tspan font-family="Times New Roman, serif" font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="10">0</tspan>，密度 <tspan font-family="Times New Roman, serif" font-style="italic">ρ</tspan>，静止</text>
<text x="560" y="100" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">断面積</text>
<text x="575" y="116" font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="#222">S</text>
<text x="66" y="74" font-family="Noto Sans CJK JP, sans-serif" font-size="12" fill="#222">ピストン</text>
<!-- ===== Fig 2 ===== -->
<text x="20" y="190" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#222">図2</text>
<line x1="90" y1="220" x2="560" y2="220" stroke="#222" stroke-width="1.6"/>
<line x1="90" y1="290" x2="560" y2="290" stroke="#222" stroke-width="1.6"/>
<!-- speaker -->
<rect x="58" y="240" width="20" height="30" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M 78 240 L 92 222 L 92 288 L 78 270 Z" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="30" y="312" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">スピーカー（振動数 <tspan font-family="Times New Roman, serif" font-style="italic">f</tspan>）</text>
<!-- rigid plate with hatch -->
<line x1="560" y1="212" x2="560" y2="298" stroke="#222" stroke-width="2.4"/>
<g stroke="#222" stroke-width="1">
<line x1="560" y1="216" x2="572" y2="206"/><line x1="560" y1="230" x2="572" y2="220"/><line x1="560" y1="244" x2="572" y2="234"/><line x1="560" y1="258" x2="572" y2="248"/><line x1="560" y1="272" x2="572" y2="262"/><line x1="560" y1="286" x2="572" y2="276"/><line x1="560" y1="300" x2="572" y2="290"/>
</g>
<text x="520" y="315" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">固い板</text>
<!-- microphone on a rod -->
<circle cx="350" cy="255" r="7" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="350" y1="248" x2="350" y2="200" stroke="#222" stroke-width="1.2"/>
<text x="360" y="205" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#222">マイクロホン（左右に動かす）</text>
<line x1="330" y1="275" x2="370" y2="275" stroke="#888" stroke-width="1" marker-start="url(#q-ak)" marker-end="url(#q-ak)"/>
</svg>
